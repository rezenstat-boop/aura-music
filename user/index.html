<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b14" />
  <meta name="description" content="AURA MUSIC — stream music you own." />
  <title>AURA MUSIC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%237c3aed'/%3E%3Cpath d='M42 30 L70 50 L42 70 Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.06)"/><path d="M42 30 L70 50 L42 70 Z" fill="currentColor"/></svg>
      <h1>AURA MUSIC</h1>
      <div class="splash-bar"><div></div></div>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="hidden">
    <!-- Desktop sidebar -->
    <aside id="sidebar">
      <a class="brand" href="#/home">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.06)"/><path d="M42 30 L70 50 L42 70 Z" fill="currentColor"/></svg>
        <span>AURA</span>
      </a>
      <nav id="sidebar-nav">
        <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</a>
        <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.3 14l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>Search</a>
        <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 4l4 1-3.5 15L13.5 19z"/></svg>Library</a>
        <a href="#/liked" data-nav="liked"><svg viewBox="0 0 24 24"><path d="M12 21s-8-4.5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6.5-8 11-8 11z"/></svg>Liked Songs</a>
        <a href="#/recent" data-nav="recent"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 100 18 9 9 0 000-18zm0 2a7 7 0 110 14 7 7 0 010-14zm-1 3v5l4.2 2.5.8-1.3-3.5-2.1V8zM3 5l3 2.5L9 5"/></svg>Recently Played</a>
        <a href="#/playlists" data-nav="playlists"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zM3 11h12v2H3zM3 16h8v2H3zM17 11v8.3a3 3 0 10 2 0V13h2v-2z"/></svg>My Playlists</a>
        <a href="#/notifications" data-nav="notifications"><svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 00-6 6v3.6L4 15v2h16v-2l-2-3.4V8a6 6 0 00-6-6zm0 20a3 3 0 003-3H9a3 3 0 003 3z"/></svg>Notifications<span id="notif-badge" class="badge hidden"></span></a>
        <a href="#/premium" data-nav="premium"><svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11zM4 18h16v2H4z"/></svg>Premium</a>
        <a href="#/profile" data-nav="profile"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 4.5V21h16v-2.5c0-2.5-4-4.5-8-4.5z"/></svg>Profile</a>
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4zM10 2h4l.6 2.6 2 .8 2.4-1.2 2 3.4-1.8 1.8.2 2.2 2.4 1.2-.9 3.6-2.6.2-1.4 1.8.9 2.5-3.4 2-2.1-1.4-2 .8L14 22h-4l-.6-2.6-2-.8-2.4 1.2-2-3.4 1.8-1.8-.2-2.2L2.2 11l.9-3.6 2.6-.2L7.1 5.4 6.2 3z"/></svg>Settings</a>
        <button id="logout-btn" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M10 3H5a2 2 0 00-2 2v14a2 2 0 002 2h5v-2H5V5h5zM14 7l-1.4 1.4L15.2 11H8v2h7.2l-2.6 2.6L14 17l5-5z"/></svg>Log out</button>
      </nav>
    </aside>

    <!-- Main content -->
    <main id="main" class="with-player">
      <div id="view"></div>
    </main>

    <!-- Mini player -->
    <div id="mini-player" class="hidden">
      <div class="mp-info" id="mp-info">
        <div class="mp-cover" id="mp-cover"></div>
        <div class="mp-text">
          <div class="mp-title" id="mp-title"></div>
          <div class="mp-artist" id="mp-artist"></div>
        </div>
      </div>
      <div class="mp-controls">
        <button id="mp-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg></button>
        <button id="mp-play" class="mp-main" aria-label="Play/Pause"><svg id="mp-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="mp-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z" transform="scale(-1,1) translate(-24,0)"/></svg></button>
      </div>
      <div class="mp-progress"><div class="mp-progress-fill" id="mp-progress-fill"></div></div>
    </div>

    <!-- Full player overlay -->
    <div id="full-player" class="hidden">
      <div class="fp-header">
        <button id="fp-close" aria-label="Close player"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        <span>Now Playing</span>
        <button id="fp-queue-btn" aria-label="Queue"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zM3 11h13v2H3zM3 16h9v2H3zM18 11v8.3a3 3 0 10 2 0V13h2v-2z"/></svg></button>
      </div>
      <div class="fp-body">
        <div class="fp-cover" id="fp-cover"></div>
        <div class="fp-meta">
          <div class="fp-title" id="fp-title"></div>
          <a class="fp-artist" id="fp-artist" href="#"></a>
        </div>
        <div class="fp-actions" id="fp-actions"></div>
        <div class="fp-seek">
          <span id="fp-current">0:00</span>
          <input type="range" id="fp-seek-bar" min="0" max="100" value="0" step="0.1" />
          <span id="fp-duration">0:00</span>
        </div>
        <div class="fp-controls">
          <button id="fp-shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M14 4l2.2 2.2L4 18.4 5.4 19.8 17.6 7.6 20 10V4zM14 20v-6l6-4v6.4L17.6 14l-1.4 1.4 1.9 1.3z" fill-rule="evenodd"/></svg></button>
          <button id="fp-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg></button>
          <button id="fp-play" class="fp-main" aria-label="Play/Pause"><svg id="fp-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="fp-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
          <button id="fp-repeat" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
        </div>
        <div class="fp-volume">
          <svg viewBox="0 0 24 24" class="vol-icon"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
          <input type="range" id="fp-volume" min="0" max="1" step="0.05" value="1" />
        </div>
      </div>
    </div>

    <!-- Queue panel -->
    <div id="queue-panel" class="hidden">
      <div class="queue-header">
        <span>Queue</span>
        <button id="queue-close" aria-label="Close queue">✕</button>
      </div>
      <div id="queue-list"></div>
    </div>

    <!-- Mobile bottom navigation -->
    <nav id="bottom-nav">
      <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg><span>Home</span></a>
      <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.3 14l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg><span>Search</span></a>
      <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 4l4 1-3.5 15L13.5 19z"/></svg><span>Library</span></a>
      <a href="#/notifications" data-nav="notifications"><svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 00-6 6v3.6L4 15v2h16v-2l-2-3.4V8a6 6 0 00-6-6zm0 20a3 3 0 003-3H9a3 3 0 003 3z"/></svg><span>Alerts</span></a>
      <a href="#/profile" data-nav="profile"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 4.5V21h16v-2.5c0-2.5-4-4.5-8-4.5z"/></svg><span>Profile</span></a>
    </nav>
  </div>

  <div id="toast-container"></div>
  <div id="modal-root"></div>

  <audio id="audio" preload="metadata"></audio>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/player.js"></script>
  <script src="js/search.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
